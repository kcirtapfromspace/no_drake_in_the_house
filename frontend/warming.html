<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="10"><title>Warming up</title><style>:root{color-scheme:light dark}html,body{margin:0;padding:0;height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;display:flex;align-items:center;justify-content:center;background:#fafafa;color:#222;line-height:1.5}main{max-width:32rem;padding:2rem;text-align:center}h1{font-size:1.5rem;font-weight:600;margin:0 0 .75rem}p{margin:0 0 .5rem;color:#555}.dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:#888;margin:0 .15rem;animation:b 1.4s infinite ease-in-out both}.dot:nth-child(1){animation-delay:-.32s}.dot:nth-child(2){animation-delay:-.16s}@keyframes b{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}@media (prefers-color-scheme:dark){body{background:#0f0f10;color:#eee}p{color:#aaa}.dot{background:#bbb}}</style></head><body><main><h1>We're warming up</h1><p>The site scales to zero when nobody's visiting, and somebody just woke it up.</p><p>This page will reload itself in 10 seconds; you should see your content shortly.</p><p aria-hidden="true" style="margin-top:1.25rem"><span class="dot"></span><span class="dot"></span><span class="dot"></span></p></main></body></html>
